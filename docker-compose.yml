services:
  retrostation-mc:
    build: .
    container_name: retrostation-mc
    ports:
      - "8787:8787"
      - "65001:65001/udp"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./sample_data:/app/sample_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - RETROGUIDE_HOST=0.0.0.0
      - RETROGUIDE_PORT=8787
      # Optional: map LAN hostnames that the container cannot resolve.
      # Example:
      # RETROGUIDE_HOST_ALIASES=media.lan=192.168.50.25,guide.lan=192.168.50.26
