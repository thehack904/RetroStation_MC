<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 282 192" width="282" height="192">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#E87000"/>
    </radialGradient>
    <radialGradient id="cloudGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E8F8"/>
    </radialGradient>
    <linearGradient id="ribbonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A7AD4"/>
      <stop offset="100%" stop-color="#0A4FA0"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD140"/>
      <stop offset="100%" stop-color="#E07A00"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A7AD4"/>
      <stop offset="100%" stop-color="#0A3D8A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <filter id="textShadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,60,0.6)"/>
    </filter>
    <clipPath id="ovalClip">
      <ellipse cx="141" cy="96" rx="130" ry="88"/>
    </clipPath>
  </defs>

  <!-- Outer gold ribbon/oval -->
  <ellipse cx="141" cy="100" rx="134" ry="90" fill="url(#ribbonGold)" filter="url(#shadow)"/>
  <!-- Inner blue oval -->
  <ellipse cx="141" cy="96" rx="120" ry="78" fill="url(#ribbonBlue)"/>

  <!-- Sun rays (behind cloud) -->
  <g transform="translate(95,55)" fill="#FFB800" opacity="0.95">
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(0)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(30)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(60)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(90)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(120)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(150)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(180)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(210)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(240)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(270)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(300)"/>
    <polygon points="0,-26 4,-10 -4,-10" transform="rotate(330)"/>
  </g>
  <!-- Sun disk -->
  <circle cx="95" cy="55" r="22" fill="url(#sunGrad)" filter="url(#shadow)"/>

  <!-- Lightning bolt -->
  <polygon points="72,42 64,72 73,68 65,96 85,60 75,64" fill="#E0E8FF" opacity="0.85" filter="url(#shadow)"/>

  <!-- Cloud (main) -->
  <g filter="url(#shadow)">
    <circle cx="148" cy="80" r="26" fill="url(#cloudGrad)"/>
    <circle cx="168" cy="72" r="20" fill="url(#cloudGrad)"/>
    <circle cx="132" cy="84" r="18" fill="url(#cloudGrad)"/>
    <circle cx="185" cy="80" r="16" fill="url(#cloudGrad)"/>
    <rect x="130" y="80" width="72" height="28" rx="4" fill="url(#cloudGrad)"/>
  </g>

  <!-- Banner -->
  <rect x="32" y="118" width="218" height="44" rx="6" fill="url(#bannerGrad)" filter="url(#shadow)"/>
  <!-- Banner highlight -->
  <rect x="32" y="118" width="218" height="8" rx="6" fill="rgba(255,255,255,0.15)"/>

  <!-- WEATHER text -->
  <text x="141" y="149" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="28" font-weight="900" font-style="italic"
        fill="white" filter="url(#textShadow)" letter-spacing="1">WEATHER</text>

  <!-- Gold bottom ribbon curve -->
  <path d="M 32,155 Q 80,175 141,172 Q 202,175 250,155 L 250,162 Q 202,184 141,181 Q 80,184 32,162 Z" fill="url(#ribbonGold)" opacity="0.7"/>
</svg>
